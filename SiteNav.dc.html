<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onMouseLeave="{{ closeMenu }}" style="position:sticky;top:0;z-index:80">
  <div style="position:relative;background:rgba(20,16,12,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(198,155,84,.3);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px clamp(16px,3vw,34px)">
    <div style="position:absolute;left:0;bottom:-1px;height:1px;width:{{ progress }};background:linear-gradient(90deg,rgba(198,155,84,.15),#C69B54);transition:width .12s linear"></div>

    <a href="index.html" style="display:flex;align-items:center;gap:11px;flex-shrink:0">
      <span style="width:32px;height:32px;border:1px solid rgba(198,155,84,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span style="font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-size:15px;line-height:1;color:#C69B54">P</span>
      </span>
      <span style="display:flex;flex-direction:column;gap:3px;white-space:nowrap">
        <span style="font-family:'Bodoni Moda',Georgia,serif;font-size:15px;line-height:1;color:#FBF7F0">Pee Skin &amp; MedSpa</span>
        <span style="font-size:7.5px;letter-spacing:.32em;text-transform:uppercase;color:rgba(251,247,240,.45)">Gwarinpa · Abuja</span>
      </span>
    </a>

    <nav aria-label="Primary" style="display:flex;gap:14px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;min-width:0" data-nav-desktop="1">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
        <a href="{{ n.href }}" onMouseEnter="{{ n.enter }}" style="display:flex;align-items:center;gap:5px;color:{{ n.color }};transition:color .3s ease" style-hover="color:#C69B54">
          <span style="width:4px;height:4px;border-radius:50%;background:{{ n.dot }};transition:background .3s ease"></span>{{ n.label }}
        </a>
      </sc-for>
    </nav>

    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <a href="https://wa.me/2349058830888?text=Hi%20Pee%20Skin%20%26%20MedSpa%2C%20I%27d%20like%20to%20book%20an%20appointment." style="background:#C69B54;color:#14100C;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:14px 24px;white-space:nowrap;flex-shrink:0;box-shadow:0 0 0 1px rgba(198,155,84,.35)" style-hover="background:#14100C;color:#C69B54;box-shadow:0 0 0 1px #C69B54">Book now</a>
      <button type="button" onClick="{{ toggleMobile }}" aria-label="Menu" style="background:none;border:1px solid rgba(198,155,84,.55);width:44px;height:44px;cursor:pointer;color:#FBF7F0;display:none;align-items:center;justify-content:center;padding:0" data-nav-mobile="1">
        <span style="display:block;width:16px;height:7px;border-top:1px solid currentColor;border-bottom:1px solid currentColor"></span>
      </button>
    </div>
  </div>

  <sc-if value="{{ menuTreatments }}" hint-placeholder-val="{{ false }}">
    <div style="background:#14100C;border-bottom:1px solid rgba(198,155,84,.28);padding:34px clamp(16px,3vw,34px) 40px;animation:psRise .4s cubic-bezier(.16,1,.3,1) both">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px">
        <span style="font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#C69B54">Four houses under one roof, every price published</span>
        <a href="pricing.html" style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,240,230,.6)" style-hover="color:#C69B54">The complete price list →</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:rgba(245,240,230,.14)">
        <sc-for list="{{ treatmentPanel }}" as="t" hint-placeholder-count="4">
          <a href="{{ t.href }}" style="background:#14100C;padding:20px 18px 24px;display:flex;flex-direction:column;gap:7px" style-hover="background:#211B14">
            <span style="font-family:'Bodoni Moda',Georgia,serif;font-size:22px;color:#F5F0E6;line-height:1.1">{{ t.label }}</span>
            <span style="font-size:12.5px;line-height:1.5;color:rgba(245,240,230,.5)">{{ t.teaser }}</span>
            <span style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#C69B54;margin-top:auto;padding-top:8px">From {{ t.from }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ menuConcerns }}" hint-placeholder-val="{{ false }}">
    <div style="background:#14100C;border-bottom:1px solid rgba(198,155,84,.28);padding:34px clamp(16px,3vw,34px) 40px;animation:psRise .4s cubic-bezier(.16,1,.3,1) both">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px">
        <span style="font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#C69B54">Nine reasons people walk through the door</span>
        <a href="concerns.html" style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,240,230,.6)" style-hover="color:#C69B54">All concerns →</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:rgba(245,240,230,.14)">
        <sc-for list="{{ concernPanel }}" as="c" hint-placeholder-count="9">
          <a href="{{ c.href }}" style="background:#14100C;padding:18px 16px 20px;display:flex;flex-direction:column;gap:6px" style-hover="background:#211B14">
            <span style="font-family:'Bodoni Moda',Georgia,serif;font-size:18px;color:#F5F0E6;line-height:1.15">{{ c.name }}</span>
            <span style="font-size:12px;line-height:1.5;color:rgba(245,240,230,.45)">{{ c.desc }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:#14100C;border-bottom:1px solid rgba(198,155,84,.28);padding:22px clamp(16px,3vw,34px) 30px;display:flex;flex-direction:column;animation:psRise .35s ease both;max-height:70vh;overflow-y:auto">
      <sc-for list="{{ mobileItems }}" as="m" hint-placeholder-count="9">
        <a href="{{ m.href }}" onClick="{{ closeMenu }}" style="font-family:'Bodoni Moda',Georgia,serif;font-size:26px;color:#F5F0E6;padding:11px 0;border-bottom:1px solid rgba(245,240,230,.12)">{{ m.label }}</a>
      </sc-for>
      <a href="tel:+2349058830888" style="margin-top:22px;font-family:'Bodoni Moda',Georgia,serif;font-size:26px;color:#C69B54">0905 883 0888</a>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu:null, mobileOpen:false, progress:'0%' };
  componentDidMount(){
    const onScroll = () => {
      const y = window.scrollY || 0;
      const h = document.documentElement.scrollHeight - window.innerHeight;
      this.setState({ progress: (h > 0 ? Math.min(100, (y/h)*100) : 0).toFixed(1) + '%' });
    };
    this._onScroll = onScroll;
    window.addEventListener('scroll', onScroll, {passive:true});
    const mq = window.matchMedia('(min-width: 960px)');
    const apply = () => {
      const root = this.el || document;
      root.querySelectorAll('[data-nav-desktop]').forEach(n => { n.style.display = mq.matches ? 'flex' : 'none'; });
      root.querySelectorAll('[data-nav-mobile]').forEach(n => { n.style.display = mq.matches ? 'none' : 'flex'; });
    };
    this._apply = apply; this._mq = mq;
    mq.addEventListener('change', apply); apply(); this._t = setInterval(apply, 600); onScroll();
  }
  componentDidUpdate(){ if (this._apply) this._apply(); }
  componentWillUnmount(){
    window.removeEventListener('scroll', this._onScroll);
    if (this._mq) this._mq.removeEventListener('change', this._apply);
    clearInterval(this._t);
  }
  renderVals(){
    const s = this.state, active = this.props.active || '';
    const item = (label, href, key) => ({
      label, href,
      enter: () => this.setState({menu: key === 'treatments' || key === 'concerns' ? key : null}),
      color: (s.menu === key || active === key) ? '#C69B54' : 'rgba(251,247,240,.82)',
      dot: (s.menu === key || active === key) ? '#C69B54' : 'transparent'
    });
    return {
      progress: s.progress,
      menuTreatments: s.menu === 'treatments',
      menuConcerns: s.menu === 'concerns',
      mobileOpen: s.mobileOpen,
      closeMenu: () => this.setState({menu:null, mobileOpen:false}),
      toggleMobile: () => this.setState(st => ({mobileOpen: !st.mobileOpen, menu:null})),
      navItems: [
        item('Home', 'index.html', 'home'),
        item('Treatments', 'treatments.html', 'treatments'),
        item('Concerns', 'concerns.html', 'concerns'),
        item('Results', 'results.html', 'results'),
        item('Pricing', 'pricing.html', 'pricing'),
        item('About', 'about.html', 'about'),
        item('Journal', 'journal.html', 'journal'),
        item('Visit', 'contact.html', 'contact')
      ],
      mobileItems: [
        {label:'Home', href:'index.html'},
        {label:'All treatments', href:'treatments.html'},
        {label:'By concern', href:'concerns.html'},
        {label:'Spa & Wellness', href:'spa-treatments.html'},
        {label:'Skin & Laser', href:'laser-hair-removal.html'},
        {label:'Aesthetics', href:'injectables.html'},
        {label:'Salon', href:'salon.html'},
        {label:'Results', href:'results.html'},
        {label:'Pricing', href:'pricing.html'},
        {label:'Gift vouchers', href:'gift-vouchers.html'},
        {label:'About', href:'about.html'},
        {label:'Contact / Visit', href:'contact.html'}
      ],
      treatmentPanel: [
        {label:'Spa & Wellness', teaser:'Hammam, massage, facials, scrubs, vajacial', from:'₦25,000', href:'spa-treatments.html'},
        {label:'Skin & Laser', teaser:'Hair removal, tattoo, acne, body sculpting', from:'₦45,000', href:'laser-hair-removal.html'},
        {label:'Aesthetics', teaser:'Dermal fillers, injectables, skin boosters', from:'₦180,000', href:'injectables.html'},
        {label:'Salon', teaser:'Hair, nails, brows and lashes', from:'₦15,000', href:'salon.html'}
      ],
      concernPanel: [
        {name:'Ingrown hairs & razor bumps', desc:'Bikini, underarms, beard line', href:'ingrown-hairs.html'},
        {name:'Dark underarms & thighs', desc:'Friction and shaving pigmentation', href:'ingrown-hairs.html'},
        {name:'Hyperpigmentation', desc:'Melasma, sun and post-acne marks', href:'laser-hair-removal.html'},
        {name:'Acne and scarring', desc:'Active breakouts and texture', href:'laser-hair-removal.html'},
        {name:'Stretch marks', desc:'Post-pregnancy body concerns', href:'spa-treatments.html'},
        {name:'Fine lines', desc:'Cheeks, nasolabial folds, lips', href:'injectables.html'},
        {name:'Unwanted tattoos', desc:'Fading and full removal', href:'laser-hair-removal.html'},
        {name:'Neck & shoulder tension', desc:'Desk work, driving, stress', href:'spa-treatments.html'},
        {name:'Bridal prep', desc:'A timed plan to the day', href:'bridal.html'}
      ]
    };
  }
}
</script>
</body>
</html>
